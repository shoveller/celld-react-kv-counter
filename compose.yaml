name: celld-react-kv-counter

x-fleet-environment: &fleet-environment
  CELLD_BUCKET: ${CELLD_BUCKET:?Inject CELLD_BUCKET with rbw-env}
  S3_ENDPOINT: ${S3_ENDPOINT:?Inject S3_ENDPOINT with rbw-env}
  AWS_REGION: ${AWS_REGION:-auto}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Inject AWS_ACCESS_KEY_ID with rbw-env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Inject AWS_SECRET_ACCESS_KEY with rbw-env}

services:
  deploy:
    build: .
    image: celld-react-kv-counter-oci:local
    profiles: [tools]
    environment: *fleet-environment
    command: [deploy, .]
    restart: "no"

  app:
    image: ghcr.io/denoland/celld:v0.6.3
    init: true
    restart: unless-stopped
    environment:
      <<: *fleet-environment
      CELLD_WATCH: /var/lib/celld/state
      # Single node: acknowledge writes after they reach R2.
      CELLD_DURABILITY: bucket
    command:
      - --listen
      - 0.0.0.0:8080
      - --internal-listen
      - 0.0.0.0:8081
      - --advertise
      - app:8081
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "${CELLD_STATE_DIR:-./data/celld-r2}:/var/lib/celld"
    healthcheck:
      # The official image has Bash/coreutils, but no Node, curl or wget.
      test:
        - CMD
        - timeout
        - "4"
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /.well-known/celld/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          head -n 1 <&3 | grep -Eq '^HTTP/1\.[01] 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-celld-test.illuwa.click}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
