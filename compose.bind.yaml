name: celld-react-kv-counter

# Standalone local-storage recipe; do not merge with compose.yaml.
# celld dev stores its object store and state under ./data/dev.
services:
  app:
    build: .
    init: true
    command: [dev, wrangler.jsonc, --host, 0.0.0.0, --port, "8080", --no-watch]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/.celld
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/counter').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s
