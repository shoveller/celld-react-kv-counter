name: celld-react-kv-counter

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "${COUNTER_DATA_DIR:-./data/counter}:/app/.celld"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-celld-test.illuwa.click}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
